<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>佳宁 · 上岸作战台</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1c2230; --sub:#6b7280; --line:#eceef3;
  --brand:#2f5fe0; --brand-soft:#eaf0ff;
  --ok:#1d9e75; --danger:#e24b4a; --warn:#ba7517; --warnbg:#faeeda;
  --pink:#d4537e; --pinkbg:#fbeaf0;
  --xc:#534ab7; --xc-soft:#eeedfe;
  --sl:#993556; --sl-soft:#fbeaf0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6;}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 120px;}
header{padding:20px 4px 8px;}
.hi{font-size:12px;color:var(--sub);} .hi b{color:var(--brand);}
h1{font-size:21px;font-weight:700;margin:2px 0 14px;letter-spacing:-.3px;}
.page{display:none;} .page.active{display:block;}
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.04);}
.section-title{font-size:15px;font-weight:700;margin:20px 4px 10px;display:flex;align-items:center;gap:7px;}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);}
.section-sub{font-size:12px;color:var(--sub);margin:-6px 4px 12px;}
.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-right:4px;}
.tag-hr{background:var(--ok);color:#fff;} .tag-sy{background:var(--brand-soft);color:var(--brand);}
.tag-gq{background:var(--warnbg);color:var(--warn);} .tag-sq{background:var(--pinkbg);color:var(--pink);}
.tag-other{background:#f1efe8;color:#5f5e5a;} .tag-closed{background:#fcebeb;color:var(--danger);font-size:10px;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:.15s;}
.btn-pri{background:var(--brand);color:#fff;}
.btn-out{background:transparent;border:1px solid var(--line);color:var(--brand);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:14px;}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:11px;padding:3px 10px;}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;z-index:50;overflow-x:auto;}
.tabbar a{flex:1 0 auto;text-align:center;padding:6px 2px calc(6px + env(safe-area-inset-bottom));font-size:9px;color:var(--sub);text-decoration:none;transition:.15s;min-width:48px;}
.tabbar a .ic{display:block;font-size:16px;margin-bottom:0;}
.tabbar a.act{color:var(--brand);font-weight:600;}
.announce-item{border-bottom:1px solid var(--line);padding:12px 0;}
.announce-item:last-child{border-bottom:none;}
.announce-item .atitle{font-size:13.5px;font-weight:600;margin-bottom:3px;line-height:1.4;}
.announce-item .atitle a{color:var(--ink);text-decoration:none;}
.announce-item .meta{font-size:11.5px;color:var(--sub);} .announce-item .meta span{margin-right:8px;}
.announce-filter{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;}
.announce-filter button{flex:0 0 auto;font-size:11px;padding:5px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--sub);white-space:nowrap;cursor:pointer;}
.announce-filter button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.updated-time{font-size:11px;color:var(--sub);text-align:right;margin:4px 4px 0;}
.cd-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.04);position:relative;}
.cd-card .cd-name{font-size:14px;font-weight:600;margin-bottom:6px;}
.cd-card .cd-date{font-size:12px;color:var(--sub);margin-bottom:8px;}
.cd-card .cd-timer{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.cd-card .cd-mode{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.cd-card .cd-mode.down{background:var(--brand-soft);color:var(--brand);}
.cd-card .cd-mode.up{background:#e1f5ee;color:var(--ok);}
.cd-card .cd-action{position:absolute;top:12px;right:12px;display:flex;gap:6px;}
.cd-empty{text-align:center;padding:40px 0;color:var(--sub);font-size:13px;}
.cd-empty .big{font-size:40px;display:block;margin-bottom:10px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav .month-label{font-size:17px;font-weight:700;}
.cal-nav button{background:var(--card);border:1px solid var(--line);border-radius:20px;font-size:13px;padding:6px 14px;cursor:pointer;color:var(--ink);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;text-align:center;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,60,.04);}
.cal-grid .dow{font-size:11px;color:var(--sub);font-weight:600;padding:10px 0 6px;background:#fafbfc;}
.cal-grid .day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;}
.cal-grid .day.today{background:var(--brand-soft);border-radius:50%;font-weight:700;color:var(--brand);}
.cal-grid .day.other{color:#d0d0d0;}
.month-goal{background:var(--brand-soft);border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.5;cursor:pointer;}
.month-goal .label{font-size:11px;color:var(--brand);font-weight:600;margin-bottom:3px;}
.week-goal-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:13px;box-shadow:0 1px 3px rgba(20,30,60,.04);cursor:pointer;}
.week-goal-item .week-num{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:10px;}
.week-goal-item .week-text{flex:1;color:var(--sub);font-size:12px;}
.week-goal-item .week-text.filled{color:var(--ink);}
.daily-progress{margin-bottom:12px;}
.daily-progress .bar{height:9px;background:var(--line);border-radius:20px;overflow:hidden;}
.daily-progress .fill{height:100%;background:var(--ok);transition:width .4s;}
.cat-panel{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,60,.04);}
.cat-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-left:3px solid transparent;}
.cat-head.xc{border-left-color:var(--xc);} .cat-head.sl{border-left-color:var(--sl);}
.cat-head.other{border-left-color:var(--brand);} .cat-head.warn{border-left-color:var(--warn);}
.cat-head .cat-label{font-size:14px;font-weight:600;}
.cat-head .cat-progress{font-size:12px;color:var(--sub);}
.cat-body{padding:0 14px 8px;display:none;}
.cat-body.open{display:block;}
.task-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.task-item input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--brand);}
.task-item .task-info{flex:1;min-width:0;} .task-item .task-name{font-size:13px;font-weight:500;}
.task-item .task-repeat{font-size:11px;color:var(--sub);margin-top:1px;}
.task-item.done .task-name{color:#aab;text-decoration:line-through;}
.task-item .task-del{background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:0 4px;opacity:.5;}
.add-task-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.add-task-row input{flex:1;min-width:100px;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:13px;background:transparent;outline:none;}
.add-task-row input:focus{border-color:var(--brand);}
.add-task-row select{border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-size:12px;background:var(--card);outline:none;}
.progress-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.04);position:relative;}
.progress-card .p-company{font-size:14px;font-weight:600;}
.progress-card .p-position{font-size:12px;color:var(--sub);margin:4px 0;}
.progress-card .p-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.progress-card .p-type-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;}
.p-type-tag.体制内{background:var(--brand-soft);color:var(--brand);}
.p-type-tag.国企{background:var(--warnbg);color:var(--warn);}
.p-type-tag.私企{background:var(--pinkbg);color:var(--pink);}
.p-type-tag.高校{background:#e1f5ee;color:var(--ok);}
.p-type-tag.其他{background:#f1efe8;color:#5f5e5a;}
.status-badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:14px;}
.status-投递{background:var(--brand-soft);color:var(--brand);}
.status-笔试{background:var(--warnbg);color:var(--warn);}
.status-面试{background:var(--pinkbg);color:var(--pink);}
.status-offer{background:#e1f5ee;color:var(--ok);}
.status-已拒{background:#f1efe8;color:#5f5e5a;}
.progress-card .p-link{font-size:11px;color:var(--brand);margin-top:6px;display:block;word-break:break-all;}
.progress-card .p-action{position:absolute;top:10px;right:10px;display:flex;gap:6px;}
.progress-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.stat-card{background:var(--card);border-radius:12px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.04);cursor:pointer;transition:.15s;border:2px solid transparent;}
.stat-card.sel{border-color:var(--brand);}
.stat-card .stat-num{font-size:22px;font-weight:700;}
.stat-card .stat-label{font-size:11px;color:var(--sub);margin-top:2px;}
.score-section{margin-bottom:16px;}
.score-form{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(20,30,60,.04);}
.score-form label{font-size:11px;color:var(--sub);display:block;margin-bottom:2px;}
.score-form input{width:56px;border:1px solid var(--line);border-radius:8px;padding:7px 6px;font-size:13px;text-align:center;outline:none;background:var(--bg);}
.score-form input:focus{border-color:var(--brand);}
.score-form .date-inp{width:110px;}
.score-form button{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;}
.score-list{font-size:12px;}
.score-list table{width:100%;border-collapse:collapse;}
.score-list td{padding:7px 5px;border-top:1px solid var(--line);text-align:center;}
.score-list tr:first-child td{border-top:none;}
.score-list .sc-del{color:var(--danger);cursor:pointer;font-size:12px;}
.trend-box{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,30,60,.04);}
.trend-box .trend-label{font-size:12px;color:var(--sub);margin-bottom:6px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--card);border-radius:16px;padding:20px;width:calc(100% - 48px);max-width:400px;max-height:85vh;overflow-y:auto;}
.modal-box h3{font-size:16px;font-weight:700;margin-bottom:14px;}
.modal-box label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;margin-top:12px;}
.modal-box label:first-of-type{margin-top:0;}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;outline:none;margin-bottom:4px;background:var(--bg);}
.modal-box textarea{min-height:60px;resize:vertical;}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{border-color:var(--brand);}
.modal-box .btn-row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.foot{text-align:center;font-size:11px;color:#aab;padding:20px 0 10px;line-height:1.6;}
.trend-svg{width:100%;height:160px;}
.cal-day-wrap{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;cursor:pointer;border-radius:12px;transition:.15s;}
.cal-day-wrap:hover{background:var(--brand-soft);}
.cal-day-wrap .dn{font-size:13px;font-weight:500;}
.cal-day-wrap.today .dn{background:var(--brand-soft);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand);}
.cal-day-wrap .dots{display:flex;gap:2px;margin-top:1px;min-height:6px;}
.cal-day-wrap .dots .dot{width:4px;height:4px;border-radius:50%;flex:0 0 auto;}
.dot-ddl{background:var(--danger);} .dot-goal{background:var(--brand);} .dot-reminder{background:var(--warn);}
.cal-day-wrap .check-ring{position:absolute;top:2px;right:4px;width:8px;height:8px;border-radius:50%;}
.check-all{background:var(--ok);} .check-partial{background:var(--warn);} .check-none{background:var(--line);border:1px solid var(--sub);}
.cal-day-wrap.other{cursor:default;} .cal-day-wrap.other:hover{background:transparent;}
.cal-day-wrap .day-emoji{position:absolute;top:1px;right:2px;font-size:10px;line-height:1;}
.event-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.event-item:last-child{border-bottom:none;}
.event-item .ev-type{font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;flex:0 0 auto;}
.ev-ddl{background:#fcebeb;color:var(--danger);} .ev-goal{background:var(--brand-soft);color:var(--brand);} .ev-reminder{background:var(--warnbg);color:var(--warn);}
.event-item .ev-title{flex:1;font-size:13px;}
.event-item .ev-del{color:var(--sub);cursor:pointer;opacity:.5;font-size:14px;padding:0 4px;}
.repeat-quick{display:flex;gap:4px;margin-bottom:6px;}
.repeat-quick button{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:transparent;cursor:pointer;transition:.15s;}
.repeat-quick button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.weekday-picker{display:flex;gap:4px;justify-content:center;}
.weekday-picker button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.weekday-picker button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.checkin-day-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line);}
.checkin-day-item:last-child{border-bottom:none;}
.checkin-day-item .ci-icon{font-size:14px;width:20px;text-align:center;flex:0 0 auto;}
.checkin-day-item.done .ci-icon{color:var(--ok);} .checkin-day-item.miss .ci-icon{color:var(--sub);}
.checkin-day-item .ci-name{flex:1;}.checkin-day-item.miss .ci-name{color:var(--sub);}
.cal-task-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line);}
.cal-task-item:last-child{border-bottom:none;}
.cal-task-item .ct-toggle{width:20px;height:20px;flex:0 0 auto;accent-color:var(--brand);}
.cal-task-item .ct-info{flex:1;min-width:0;}
.cal-task-item .ct-title{font-size:13px;font-weight:500;}
.cal-task-item .ct-range{font-size:11px;color:var(--sub);}
.cal-task-item.done .ct-title{color:#aab;text-decoration:line-through;}
.cal-task-item .ct-del{color:var(--sub);font-size:14px;cursor:pointer;opacity:.5;padding:0 4px;}
.cal-day-wrap .dots .dot.dot-task{background:var(--ok);}
.cal-day-wrap .dots .dot.dot-task-miss{background:var(--line);border:1px solid var(--sub);}
@media(max-width:380px){.tabbar a{font-size:8px;min-width:44px;}.tabbar a .ic{font-size:14px;}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <div class="hi">你好，<b>佳宁</b> · 上岸作战台 <span id="syncBadge" style="float:right;font-size:11px;">🔄 连接中</span></div>
  <h1 id="pageTitle">最新公告</h1>
</header>

<!-- PAGE 1: 公告 -->
<div class="page active" id="page-announce">
  <div class="row" style="margin-bottom:8px;">
    <button class="btn btn-pri btn-sm" onclick="showAnnModal()">+ 手动添加</button>
    <button class="btn btn-pri btn-sm" onclick="dailySearch()">🔍 每日查找</button>
  </div>
  <div class="announce-filter" id="filterBar">
    <button class="on" data-cat="all">全部</button>
    <button data-cat="选调">选调</button><button data-cat="国考">国考</button>
    <button data-cat="高校">高校</button><button data-cat="事业单位">事业</button>
    <button data-cat="国企">国企</button><button data-cat="私企">私企</button>
    <button data-cat="军队文职">文职</button>
  </div>
  <div class="updated-time" id="updateTime"></div>
  <div id="announceList"></div>
</div>

<!-- PAGE 2: 倒计时 -->
<div class="page" id="page-countdown">
  <div class="row" style="margin-bottom:10px;">
    <span class="section-sub" style="margin:0;">支持倒计时(还剩X天)与正计时(已过X天)</span>
    <button class="btn btn-pri btn-sm" onclick="showCDModal()">+ 添加</button>
  </div>
  <div id="countdownList"><div class="cd-empty"><span class="big">⏱</span>还没有添加倒计时<br>点击 + 添加第一个</div></div>
</div>

<!-- PAGE 3: 日历 -->
<div class="page" id="page-calendar">
  <div class="cal-nav">
    <button onclick="calShift(-1)">&lt; 上月</button>
    <span class="month-label" id="calMonthLabel">--</span>
    <button onclick="calShift(1)">下月 &gt;</button>
  </div>
  <div class="month-goal" id="monthGoalBox" onclick="showMonthGoalModal()">
    <div class="label">本月目标</div>
    <div id="monthGoalText" style="color:var(--sub);">点击设置本月目标</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="week-goals" id="weekGoalsList" style="margin-top:10px;"></div>
</div>

<!-- PAGE 4: 日打卡 -->
<div class="page" id="page-daily">
  <div class="row" style="margin-bottom:8px;">
    <span style="font-size:12px;color:var(--sub);">查看日期</span>
    <input type="date" id="dailyViewDate" onchange="renderDaily()" style="border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;background:var(--card);">
    <button class="btn btn-out btn-sm" onclick="document.getElementById('dailyViewDate').value='';renderDaily();">今天</button>
  </div>
  <div class="daily-progress" id="dailyProgress"></div>
  <div id="catPanels"></div>
  <div class="add-task-row">
    <input type="text" id="newTaskName" placeholder="新任务名称...">
    <select id="newTaskCat">
      <option value="行测">行测</option><option value="申论">申论</option>
      <option value="秋招">秋招</option><option value="毕业">毕业</option>
    </select>
    <div class="repeat-picker-box" style="margin-top:4px;">
      <div class="repeat-quick">
        <button class="on" id="rpAll" onclick="setQuickRepeat('all')">每天</button>
        <button id="rpWorkday" onclick="setQuickRepeat('workday')">工作日</button>
        <button id="rpNone" onclick="setQuickRepeat('none')">不重复</button>
      </div>
      <div class="weekday-picker" id="weekdayPicker">
        <button data-day="1" class="on">一</button><button data-day="2" class="on">二</button>
        <button data-day="3" class="on">三</button><button data-day="4" class="on">四</button>
        <button data-day="5" class="on">五</button><button data-day="6">六</button><button data-day="0">日</button>
      </div>
    </div>
    <div style="display:flex;gap:4px;align-items:center;font-size:11px;color:var(--sub);margin-top:4px;">
      <span>起</span><input type="date" id="newTaskStart" style="border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11px;background:transparent;width:115px;">

function getAllAnnouncements(){
  const combined=[...userAnnouncements,...userDiscoveredAnnouncements];
  const combinedUrls=new Set(combined.map(a=>a.url).filter(Boolean));
  return [...combined,...baseAnnouncements.filter(b=>!combinedUrls.has(b.url))];
}

async function dailySearch(){
  document.getElementById('updateTime').textContent='搜索中...';
  try{
    const resp=await fetch('job_announcements.json?t='+Date.now());
    const data=await resp.json();
    if(!data.announcements||!data.announcements.length){
      document.getElementById('updateTime').textContent='每日查找：未发现新公告 · '+data.updated?.replace('T',' ')||'';
      toast('未发现新公告');
      renderAnnounces();return;
    }
    // 收集所有已有 URL
    const existingUrls=new Set();
    EMBED_ANNOUNCEMENTS.announcements.forEach(a=>{if(a.url)existingUrls.add(a.url.trim());});
    userAnnouncements.forEach(a=>{if(a.url)existingUrls.add(a.url.trim());});
    userDiscoveredAnnouncements.forEach(a=>{if(a.url)existingUrls.add(a.url.trim());});
    // 只保留真正的新条目
    const newEntries=data.announcements.filter(a=>a.url&&!existingUrls.has(a.url.trim()));
    if(newEntries.length===0){
      document.getElementById('updateTime').textContent='每日查找：无新增（已是最新）· 共'+getAllAnnouncements().length+'条';
      toast('已是最新，无新增公告');
    }else{

      document.getElementById('updateTime').textContent='每日查找：新增 '+newEntries.length+' 条 · 共'+getAllAnnouncements().length+'条';
      toast('🎉 新增 '+newEntries.length+' 条公告！');
    }
  }catch(e){
    document.getElementById('updateTime').textContent='每日查找：未连接（共'+getAllAnnouncements().length+'条）';
    toast('无法连接，使用本地数据');
  }

function renderCalendar(){
  const now=new Date();if(!calYear){calYear=now.getFullYear();calMonth=now.getMonth()+1;}
  document.getElementById('calMonthLabel').textContent=calYear+'年 '+calMonth+'月';
  const key=calYear+'-'+String(calMonth).padStart(2,'0'),mg=S.monthlyGoals[key]||'';
  document.getElementById('monthGoalText').textContent=mg||'点击设置本月目标';
  document.getElementById('monthGoalText').style.color=mg?'var(--ink)':'var(--sub)';
  const grid=document.getElementById('calGrid'),dows=['日','一','二','三','四','五','六'];
  grid.innerHTML=dows.map(d=>'<div class="dow">'+d+'</div>').join('');
  const fd=new Date(calYear,calMonth-1,1).getDay(),dim=new Date(calYear,calMonth,0).getDate();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  for(let i=0;i<fd;i++)grid.innerHTML+='<div class="cal-day-wrap other"><span class="dn"></span></div>';
  for(let d=1;d<=dim;d++){
    const ds=calYear+'-'+String(calMonth).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const events=S.calendarEvents[ds]||[];
    const tasksOnDay=S.calendarTasks.filter(t=>t.startDate<=ds&&t.endDate>=ds);
    const dots=events.slice(0,3).map(e=>'<span class="dot dot-'+e.type+'"></span>').join('')
      +tasksOnDay.slice(0,3-events.length).map(t=>{
        const done=t.completions&&t.completions[ds];
        return '<span class="dot '+(done?'dot-task':'dot-task-miss')+'"></span>';
      }).join('');
    const completion=getDayStatus(ds);
    const statusEmoji=getDayEmoji(completion);
    grid.innerHTML+='<div class="cal-day-wrap'+(ds===ts?' today':'')+'" onclick="showDayDetail(\''+ds+'\')"><span class="dn">'+d+'</span><span class="dots">'+dots+'</span><span class="day-emoji">'+statusEmoji+'</span></div>';
  }
  const weeks=[];
  for(let w=0;w<6;w++){const d1=1+w*7-fd,d2=Math.min(d1+6,dim);if(d1>dim)break;weeks.push({start:d1,end:d2,label:w+1});}
  const wl=document.getElementById('weekGoalsList');
  wl.innerHTML=weeks.map(w=>{const wk=getWeekKey(calYear,calMonth,w.start),goal=S.weeklyGoals[wk]||'';
    return `<div class="week-goal-item" onclick="showWeekGoalModal('${wk}','${calYear}年${calMonth}月 第${w.label}周 (${w.start}-${w.end}日)')"><span class="week-num">第${w.label}周</span><span class="week-text ${goal?'filled':''}">${goal||'点击设置周目标'}</span></div>`;}).join('');}

function getTasksForDate(dateStr){
  const d=new Date(dateStr+'T00:00:00'),dow=d.getDay();
  return S.dailyTasks.filter(t=>{
    if(t.startDate&&dateStr<t.startDate)return false;
    if(t.endDate&&dateStr>t.endDate)return false;
    if(t.repeatDays&&t.repeatDays.length)return t.repeatDays.includes(dow);
    if(t.repeat==='daily')return true;
    if(t.repeat==='weekdays')return dow>=1&&dow<=5;
    if(t.repeat==='weekly')return dow===1;
    return false;
  });
}
function getDayStatus(dateStr){
  // DDL priority
  const events=S.calendarEvents[dateStr]||[];
  if(events.length)return'ddl';
  const tasks=getTasksForDate(dateStr);
  if(!tasks.length)return null;
  const done=tasks.filter(t=>t.completions&&t.completions[dateStr]).length;
  return done===tasks.length?'all':'partial';
}
function getDayEmoji(status){
  if(status==='ddl')return'❗️';
  if(status==='all')return'✅';
  if(status==='partial')return'⚠️';
  return'';
}

function setQuickRepeat(mode){

  else if(mode==='workday'){btns.forEach(b=>{const d=parseInt(b.dataset.day);b.classList.toggle('on',d>=1&&d<=5);});}
  else if(mode==='none'){btns.forEach(b=>b.classList.remove('on'));}
  document.getElementById('rpAll').classList.toggle('on',mode==='all');
  document.getElementById('rpWorkday').classList.toggle('on',mode==='workday');

}
function getSelectedRepeatDays(){
  return Array.from(document.querySelectorAll('#weekdayPicker button.on')).map(b=>parseInt(b.dataset.day));
}
function getRepeatLabelLite(task){
  if(!task.repeatDays||!task.repeatDays.length){
    if(task.repeat==='daily')return'每天';
    if(task.repeat==='weekdays')return'工作日';
    if(task.repeat==='weekly')return'每周';
    return'不重复';
  }
  if(task.repeatDays.length===7)return'每天';
  if(task.repeatDays.length===5&&task.repeatDays.includes(1)&&task.repeatDays.includes(5)&&!task.repeatDays.includes(0)&&!task.repeatDays.includes(6))return'工作日';
  const names=['日','一','二','三','四','五','六'];
  return'每周'+task.repeatDays.sort((a,b)=>a-b).map(d=>names[d]).join('');
}
function getRepeatLabel(task){return getRepeatLabelLite(task);}

        return `<div class="task-item ${dn}"><input type="checkbox" data-tid="${t.id}" data-date="${today}" ${ck} onchange="toggleTask(this)"><div class="task-info"><div class="task-name">${t.name}</div><div class="task-repeat">${getRepeatLabel(t)}</div></div><button class="task-del" onclick="delTask(event,'${t.id}')">×</button></div>`;}).join('')||'<div style="padding:8px 0;color:var(--sub);font-size:12px;">今日无任务</div>'}</div>
    </div>`;}).join('');}
function toggleTask(cb){const tid=cb.dataset.tid,date=cb.dataset.date,task=S.dailyTasks.find(t=>t.id===tid);if(!task)return;if(!task.completions)task.completions={};if(cb.checked)task.completions[date]=true;else delete task.completions[date];save();renderDaily();}
function addDailyTask(){const name=document.getElementById('newTaskName').value.trim();if(!name){toast('请输入任务名称');return;}
  const days=getSelectedRepeatDays(),startDate=document.getElementById('newTaskStart').value,endDate=document.getElementById('newTaskEnd').value;
  S.dailyTasks.push({id:'t'+Date.now(),name,repeat:days.length===7?'daily':days.length===0?'none':'custom',repeatDays:days,
    startDate:startDate||null,endDate:endDate||null,
    category:document.getElementById('newTaskCat').value,completions:{}});
  document.getElementById('newTaskName').value='';save();renderDaily();toast('已添加');}
function delTask(e,tid){e.stopPropagation();if(!confirm('删除此任务？'))return;S.dailyTasks=S.dailyTasks.filter(t=>t.id!==tid);save();renderDaily();toast('已删除');}

/* ===== PAGE 5: 秋招进度（可筛选）===== */
if(!S.progress)S.progress=[];
let progressFilter=null;
function renderProgress(){
  const stats=document.getElementById('progressStats');
  const cnt={投递:0,笔试:0,面试:0,offer:0}; S.progress.forEach(p=>{if(cnt[p.status]!==undefined)cnt[p.status]++;});
  stats.innerHTML=[{l:'已投递',n:cnt['投递'],s:'投递',c:'var(--brand)'},{l:'笔试中',n:cnt['笔试'],s:'笔试',c:'var(--warn)'},{l:'面试中',n:cnt['面试'],s:'面试',c:'var(--pink)'},{l:'已Offer',n:cnt['offer'],s:'offer',c:'var(--ok)'}]
    .map(s=>`<div class="stat-card ${progressFilter===s.s?'sel':''}" onclick="toggleProgressFilter('${s.s}')"><div class="stat-num" style="color:${s.c};">${s.n}</div><div class="stat-label">${s.l}</div></div>`).join('');
  document.getElementById('progressFilterLabel').textContent='显示：'+(progressFilter||'全部');
  const items=progressFilter?S.progress.filter(p=>p.status===progressFilter):S.progress;
  const list=document.getElementById('progressList');
  if(!items.length){list.innerHTML='<div class="cd-empty"><span class="big">📊</span>'+(progressFilter?'该状态下暂无记录':'还没有跟踪的投递')+'</div>';return;}
  list.innerHTML=items.map((p,i)=>{const oi=S.progress.indexOf(p);
    return `<div class="progress-card"><div class="p-action"><button class="btn btn-out btn-sm" onclick="editProgress(${oi})">编辑</button><button class="btn btn-danger" onclick="deleteProgress(${oi})">删除</button></div>
    <div class="p-company">${p.company}</div><div class="p-position">${p.position}</div>
    <div class="p-meta"><span class="p-type-tag ${p.type}">${p.type}</span><span class="status-badge status-${p.status}">${p.status}</span></div>
    ${p.link?`<a class="p-link" href="${p.link}" target="_blank" rel="noopener">${p.link}</a>`:''}</div>`;}).join('');}
function toggleProgressFilter(s){progressFilter=progressFilter===s?null:s;renderProgress();}
function showProgressModal(ei){const m=document.getElementById('progressModal');
  if(ei!==undefined){document.getElementById('progressModalTitle').textContent='编辑投递记录';const p=S.progress[ei];document.getElementById('prCompany').value=p.company;document.getElementById('prType').value=p.type;document.getElementById('prPosition').value=p.position;document.getElementById('prStatus').value=p.status;document.getElementById('prLink').value=p.link||'';document.getElementById('prEditId').value=ei;}
  else{document.getElementById('progressModalTitle').textContent='添加投递记录';document.getElementById('prCompany').value='';document.getElementById('prType').value='私企';document.getElementById('prPosition').value='';document.getElementById('prStatus').value='投递';document.getElementById('prLink').value='';document.getElementById('prEditId').value='';}
  m.classList.add('show');}
function closeProgressModal(){document.getElementById('progressModal').classList.remove('show');}
function saveProgress(){const c=document.getElementById('prCompany').value.trim(),t=document.getElementById('prType').value,p=document.getElementById('prPosition').value.trim(),s=document.getElementById('prStatus').value,l=document.getElementById('prLink').value.trim(),ei=document.getElementById('prEditId').value;if(!c||!p){toast('请填写企业名称和岗位');return;}const o={company:c,type:t,position:p,status:s,link:l};if(ei!=='')S.progress[ei]=o;else S.progress.push(o);save();closeProgressModal();renderProgress();toast('已保存');}
function editProgress(i){showProgressModal(i);} function deleteProgress(i){if(confirm('删除？')){S.progress.splice(i,1);save();renderProgress();toast('已删除');}}

/* ===== PAGE 6: 分数统计 ===== */
if(!S.xcScores)S.xcScores=[]; if(!S.slScores)S.slScores=[];
const XC_MODULES=['资料分析','判断推理','言语理解','数量关系','常识判断','政治理论'];

function addXcScore(){
  const dt=document.getElementById('xcDate').value||new Date().toISOString().slice(0,10);
  const ov=parseFloat(document.getElementById('xcOverall').value);
  const tm=parseInt(document.getElementById('xcTime').value)||120;
  if(isNaN(ov)||ov<0||ov>100){toast('请输入有效的总分(0-100)');return;}
  const mods={};
  for(const m of XC_MODULES){const el=document.getElementById('xc'+(m==='资料分析'?'ZL':m==='判断推理'?'PD':m==='言语理解'?'YY':m==='数量关系'?'SL':m==='常识判断'?'CS':'ZZ'));const v=parseFloat(el.value);if(!isNaN(v)&&v>=0&&v<=100)mods[m]=v;}
  S.xcScores.push({date:dt,overall:ov,minutes:tm,modules:mods}); S.xcScores.sort((a,b)=>a.date.localeCompare(b.date));
  save();renderScores();toast('行测分数已录入');
  for(const id of['xcDate','xcOverall','xcZL','xcPD','xcYY','xcSL','xcCS','xcZZ']){document.getElementById(id).value='';}
  document.getElementById('xcTime').value='120';}
function addSlScore(){
  const dt=document.getElementById('slDate').value||new Date().toISOString().slice(0,10),sc=parseFloat(document.getElementById('slScore').value);
  const tm=parseInt(document.getElementById('slTime').value)||180;
  if(isNaN(sc)||sc<0||sc>100){toast('请输入有效的分数(0-100)');return;}
  S.slScores.push({date:dt,score:sc,minutes:tm}); S.slScores.sort((a,b)=>a.date.localeCompare(b.date));
  save();renderScores();toast('申论分数已录入');document.getElementById('slDate').value='';document.getElementById('slScore').value='';document.getElementById('slTime').value='180';}

function renderScores(){
  /* 行测 */
  const xcList=document.getElementById('xcScoreList');
  if(!S.xcScores.length){xcList.innerHTML='<div style="text-align:center;color:var(--sub);padding:16px;">暂无记录，录入第一条分数开始追踪</div>';}
  else{xcList.innerHTML='<div class="card"><table><tr style="font-weight:600;">'+['日期','总分','用时','',...XC_MODULES,''].map(h=>'<td>'+h+'</td>').join('')+'</tr>'+S.xcScores.map((s,i)=>'<tr>'+['<td>'+s.date+'</td>','<td><b>'+s.overall+'</b></td>','<td>'+(s.minutes||'-')+'分</td>','',...XC_MODULES.map(m=>'<td>'+(s.modules&&s.modules[m]!==undefined?s.modules[m]:'-')+'</td>'),'<td class="sc-del" onclick="delXcScore('+i+')">×</td>'].join('')+'</tr>').join('')+'</table></div>';}
  document.getElementById('xcTrendBox').innerHTML=drawTrend(S.xcScores,'overall','行测总分趋势','var(--xc)')+drawTrend(S.xcScores,'minutes','行测用时趋势（分）','var(--warn)')+drawModulesTrend();

  /* 申论 */
  const slList=document.getElementById('slScoreList');
  if(!S.slScores.length){slList.innerHTML='<div style="text-align:center;color:var(--sub);padding:16px;">暂无记录</div>';}
  else{slList.innerHTML='<div class="card"><table><tr style="font-weight:600;"><td>日期</td><td>分数</td><td>用时</td><td></td></tr>'+S.slScores.map((s,i)=>'<tr><td>'+s.date+'</td><td><b>'+s.score+'</b></td><td>'+(s.minutes||'-')+'分</td><td class="sc-del" onclick="delSlScore('+i+')">×</td></tr>').join('')+'</table></div>';}
  document.getElementById('slTrendBox').innerHTML=drawTrend(S.slScores,'score','申论分数趋势','var(--sl)')+drawTrend(S.slScores,'minutes','申论用时趋势（分）','var(--warn)');}
function delXcScore(i){S.xcScores.splice(i,1);save();renderScores();toast('已删除');}
function delSlScore(i){S.slScores.splice(i,1);save();renderScores();toast('已删除');}

function drawTrend(data,field,label,color){
  if(data.length<2)return '<div class="trend-label">'+label+'（至少2条数据才显示趋势图）</div>';
  const W=640,H=140,pad=32,min=Math.min(...data.map(d=>d[field]))-2,max=Math.max(...data.map(d=>d[field]))+2,range=max-min||1;
  const sx=(W-2*pad)/(data.length-1),sy=(H-2*pad)/range;
  let points='',poly='',i=0;
  for(const d of data){const x=pad+i*sx,y=H-pad-(d[field]-min)*sy;points+=x.toFixed(1)+','+y.toFixed(1)+' ';poly+=(i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1)+' ';i++;}
  const pl=poly+'L'+(pad+(data.length-1)*sx).toFixed(1)+' '+(H-pad).toFixed(0)+' L'+pad.toFixed(1)+' '+(H-pad).toFixed(0)+' Z';
  return `<div class="trend-label">${label}（${data.length}条记录）</div>
    <svg viewBox="0 0 ${W} ${H}" class="trend-svg" role="img"><title>${label}</title>
    <polyline points="${points.trim()}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="${pl}" fill="${color}" opacity="0.08"/>
    ${data.map((d,j)=>{const x=pad+j*sx,y=H-pad-(d[field]-min)*sy;return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="'+color+'"/><text x="'+x.toFixed(1)+'" y="'+(y-8).toFixed(1)+'" text-anchor="middle" font-size="10" fill="'+color+'" font-weight="600">'+d[field]+'</text>';}).join('')}
    </svg>`;}
function drawModulesTrend(){
  if(S.xcScores.length<2)return '';
  const W=640,H=120,pad=28,colors=['#534ab7','#2f5fe0','#1d9e75','#ba7517','#e24b4a','#d4537e'];
  let svg='<div class="trend-label" style="margin-top:8px;">各模块正确率趋势</div><svg viewBox="0 0 '+W+' '+H+'" class="trend-svg" role="img"><title>模块趋势</title>';
  XC_MODULES.forEach((m,mi)=>{
    const pts=S.xcScores.filter(d=>d.modules&&d.modules[m]!==undefined);
    if(pts.length<2)return;
    const sx=(W-2*pad)/(pts.length-1),sy=(H-2*pad)/100;
    let points='';
    pts.forEach((d,i)=>{const x=pad+i*sx,y=H-pad-d.modules[m]*sy;points+=x.toFixed(1)+','+y.toFixed(1)+' ';});
    svg+='<polyline points="'+points.trim()+'" fill="none" stroke="'+colors[mi]+'" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>';
  });
  svg+='</svg>';
  /* legend */
  svg+='<div style="display:flex;flex-wrap:wrap;gap:8px;font-size:11px;margin-top:4px;padding:0 4px;">'+XC_MODULES.map((m,i)=>'<span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:'+colors[i]+';"></span>'+m+'</span>').join('')+'</div>';
  return svg;}

/* Modal overlay click */
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));

/* Weekday picker toggle */
document.getElementById('weekdayPicker').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON'||!e.target.dataset.day)return;
  e.target.classList.toggle('on');
  const days=getSelectedRepeatDays();
  document.getElementById('rpAll').classList.toggle('on',days.length===7);
  document.getElementById('rpWorkday').classList.toggle('on',days.length===5&&days.includes(1)&&!days.includes(0)&&!days.includes(6));
  document.getElementById('rpNone').classList.toggle('on',days.length===0);
});

/* Init — render instantly with localStorage, then sync cloud */
renderCDs();
setCalMonth((new Date()).getFullYear(),(new Date()).getMonth()+1);
renderDaily();renderProgress();renderScores();
setInterval(()=>{if(document.getElementById('page-countdown').classList.contains('active'))renderCDs();},30000);

loadFromCloud().then(synced=>{
  if(synced){
    toast('☁️ 云端数据已同步');
    renderCDs();
    setCalMonth((new Date()).getFullYear(),(new Date()).getMonth()+1);
    renderDaily();renderProgress();renderScores();
  }
});
</script>
