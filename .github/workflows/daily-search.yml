name: 每日搜索心理学可投递岗位

on:
  schedule:
    # 北京时间每天 8:30 (UTC 0:30)
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  search-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行岗位搜索脚本
        run: python auto_search_jobs.py

      - name: 提交更新（如有新数据）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_announcements.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "📋 每日岗位搜索自动更新 $(date +'%Y-%m-%d')"
            git push
          fi
